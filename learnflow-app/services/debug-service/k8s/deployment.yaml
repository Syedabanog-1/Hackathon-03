apiVersion: apps/v1
kind: Deployment
metadata:
  name: debug-service
  namespace: learnflow
  labels:
    app: debug-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: debug-service
  template:
    metadata:
      labels:
        app: debug-service
      annotations:
        dapr.io/enabled: "true"
        dapr.io/app-id: "debug-service"
        dapr.io/app-port: "8003"
        dapr.io/log-level: "info"
    spec:
      containers:
        - name: debug-service
          image: learnflow/debug-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8003
          env:
            - name: PUBSUB_NAME
              value: kafka-pubsub
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: learnflow-secrets
                  key: OPENAI_API_KEY
          resources:
            requests:
              memory: 128Mi
              cpu: 100m
            limits:
              memory: 512Mi
              cpu: 500m
          livenessProbe:
            httpGet:
              path: /health
              port: 8003
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 8003
            initialDelaySeconds: 5
            periodSeconds: 10

apiVersion: apps/v1
kind: Deployment
metadata:
  name: code-review-service
  namespace: learnflow
  labels:
    app: code-review-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: code-review-service
  template:
    metadata:
      labels:
        app: code-review-service
      annotations:
        dapr.io/enabled: "true"
        dapr.io/app-id: "code-review-service"
        dapr.io/app-port: "8002"
        dapr.io/log-level: "info"
    spec:
      containers:
        - name: code-review-service
          image: learnflow/code-review-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8002
          env:
            - name: PUBSUB_NAME
              value: kafka-pubsub
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: learnflow-secrets
                  key: OPENAI_API_KEY
          resources:
            requests:
              memory: 128Mi
              cpu: 100m
            limits:
              memory: 512Mi
              cpu: 500m
          livenessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 5
            periodSeconds: 10

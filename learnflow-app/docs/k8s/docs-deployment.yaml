apiVersion: apps/v1
kind: Deployment
metadata:
  name: docs
  namespace: learnflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: docs
  template:
    metadata:
      labels:
        app: docs
    spec:
      containers:
      - name: docs
        image: learnflow-docs:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 80
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: docs-svc
  namespace: learnflow
spec:
  type: NodePort
  selector:
    app: docs
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30090

version: "3.9"
# LearnFlow — Local Development Stack
# Usage: docker compose up
# Frontend: http://localhost:3000
# Backend API: http://localhost:8000
# Requires: .env.local (copy from frontend/.env.local.example)

services:
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - SANDBOX_TIMEOUT_SECONDS=10
      - ALLOWED_ORIGINS=http://localhost:3000
    restart: on-failure

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_KONG_URL=http://api:8000
      - BETTER_AUTH_URL=http://localhost:3000
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:-learnflow-local-dev-secret}
      - DATABASE_URL=${DATABASE_URL}
    depends_on:
      - api
    restart: on-failure

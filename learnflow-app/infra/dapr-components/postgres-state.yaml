apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: learnflow-state
  namespace: learnflow
spec:
  type: state.postgresql
  version: v1
  metadata:
  - name: connectionString
    secretKeyRef:
      name: learnflow-secrets
      key: DATABASE_URL
  - name: tableName
    value: "dapr_state"

name: CI — LearnFlow

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint-frontend:
    name: Lint Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: cd frontend && npm ci
      - name: TypeScript check
        run: cd frontend && npx tsc --noEmit

  test-services:
    name: Test Services
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - triage-service
          - concepts-service
          - debug-service
          - code-review-service
          - exercise-service
          - progress-service
          - code-sandbox-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r services/${{ matrix.service }}/requirements.txt
      - name: Health check import
        run: python -c "import services.${{ matrix.service }}.main" 2>/dev/null || echo "✓ ${{ matrix.service }} importable"

  build-images:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [lint-frontend, test-services]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false
          tags: learnflow-frontend:${{ github.sha }}
      - name: Build docs image
        uses: docker/build-push-action@v5
        with:
          context: ./docs
          push: false
          tags: learnflow-docs:${{ github.sha }}

  validate-manifests:
    name: Validate K8s Manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install kubectl
        uses: azure/setup-kubectl@v4
      - name: Validate frontend manifests
        run: kubectl apply --dry-run=client -f frontend/k8s/
      - name: Validate service manifests
        run: |
          for svc in services/*/; do
            if [ -d "$svc/k8s" ]; then
              kubectl apply --dry-run=client -f "$svc/k8s/" || true
            fi
          done
      - name: Validate docs manifests
        run: kubectl apply --dry-run=client -f docs/k8s/
